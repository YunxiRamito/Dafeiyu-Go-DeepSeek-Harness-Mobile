<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dafeiyu-GO · DSH 手机网页预览</title>
  <style>
    :root { --ease:cubic-bezier(.16,1,.3,1);--bg:#f2f2f7;--ink:#1c1c1e;--muted:#73737b;--panel:rgba(255,255,255,.74);--line:rgba(28,28,30,.08);--blue:#007aff;color-scheme:light; }
    @media(prefers-color-scheme:dark) { :root { --bg:#101013;--ink:#f5f5f7;--muted:#aaaab2;--panel:rgba(28,28,30,.8);--line:rgba(255,255,255,.12);--blue:#64b5ff;color-scheme:dark; } }
    * { box-sizing:border-box; }
    body { margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 5%,rgba(0,122,255,.06),transparent 42%),var(--bg); }
    .preview { min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;max-width:1180px;margin:auto;padding:48px 32px;align-items:start; }
    aside { position:sticky;top:40px;animation:enter 380ms var(--ease) both; }
    .caption { color:var(--blue);font-size:13px;font-weight:600;letter-spacing:.08em; }
    h1 { font-size:27px;line-height:1.25;letter-spacing:-.7px;margin:8px 0 12px; }
    p { color:var(--muted);margin:0 0 24px; }
    .controls { padding:20px;border:1px solid var(--line);border-radius:24px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 3px 12px rgba(0,0,0,.04); }
    fieldset { margin:0 0 18px;padding:0;border:0; }
    legend,.label { font-size:13px;font-weight:600;margin:0 0 8px; }
    .sizes { display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--line);border-radius:14px; }
    .sizes label { display:block;position:relative;cursor:pointer; }
    .sizes input { position:absolute;opacity:0;width:100%;height:100%;margin:0; }
    .sizes span { display:block;text-align:center;padding:7px 0;border-radius:10px;transition:background 150ms var(--ease),box-shadow 150ms var(--ease); }
    .sizes input:checked + span { background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .sizes input:focus-visible + span { outline:2px solid var(--blue);outline-offset:2px; }
    select,button,.link { font:inherit; }
    select { display:block;width:100%;padding:9px 12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px; }
    .toggle { display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;cursor:pointer; }
    .toggle input { accent-color:var(--blue);width:18px;height:18px; }
    .reload { width:100%;margin:16px 0 0;padding:10px 12px;border:0;border-radius:14px;color:#fff;background:var(--blue);cursor:pointer;transition:transform 150ms var(--ease),filter 150ms var(--ease); }
    .reload:active { transform:scale(.98);filter:brightness(1.06); }
    .replay { width:100%;margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--panel);cursor:pointer;transition:transform 150ms var(--ease),opacity 180ms var(--ease); }
    .replay:active { transform:scale(.98); }
    .replay:disabled { opacity:.5;cursor:default; }
    .replay-status { margin:8px 0 0;font-size:12px;min-height:36px; }
    :is(select,button,a):focus-visible { outline:2px solid var(--blue);outline-offset:3px; }
    .links { display:flex;gap:20px;margin-top:18px; }
    .link { color:var(--blue);text-decoration:none; }
    .link:hover { text-decoration:underline; }
    .viewport { min-width:0;display:flex;justify-content:center;animation:enter 380ms var(--ease) both; }
    .phone { width:calc(var(--preview-width,390px) + 2px);max-width:100%;border:1px solid var(--line);border-radius:32px;overflow:hidden;background:var(--panel);box-shadow:0 10px 34px rgba(0,0,0,.08);transition:width 360ms var(--ease); }
    iframe { width:100%;height:844px;display:block;border:0;background:var(--bg); }
    .note { font-size:12px;margin-top:16px; }
    @keyframes enter { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    @media(max-width:760px) { .preview { display:block;padding:24px 16px; }.controls { padding:16px; }aside { position:static;max-width:430px;margin:0 auto 24px; }h1 { font-size:24px; }.viewport { width:100%; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important;transition:none!important; } }
  </style>
</head>
<body>
  <main class="preview">
    <aside>
      <div class="caption">DAFEIYU-GO</div>
      <h1>DSH 手机网页预览</h1>
      <p>在电脑上查看并操作手机界面。</p>
      <form class="controls" id="controls">
        <fieldset>
          <legend>屏幕宽度</legend>
          <div class="sizes">
            <label><input type="radio" name="width" value="320"><span>320</span></label>
            <label><input type="radio" name="width" value="390" checked><span>390</span></label>
            <label><input type="radio" name="width" value="430"><span>430</span></label>
          </div>
        </fieldset>
        <label class="label" for="theme">外观</label>
        <select id="theme" name="theme"><option value="system">跟随 DSH 外观</option><option value="light">浅色</option><option value="dark">深色</option></select>
        <label class="toggle"><span>液态玻璃材质</span><input type="checkbox" name="material" checked></label>
        <label class="toggle"><span>界面动画</span><input type="checkbox" name="motion" checked></label>
        <button class="reload" type="button" id="reload">刷新预览</button>
        <button class="replay" type="button" id="replay-startup">预览启动动画</button>
        <p class="replay-status" id="replay-status" role="status">播放等待、缩回左上角和进入页面的动画。</p>
      </form>
      <div class="links"><a class="link" id="full" target="_blank" rel="noopener">打开完整预览</a><a class="link" href="http://127.0.0.1:8787/" target="_blank" rel="noopener">打开电脑版</a></div>
      <p class="note">操作会作用于当前 DSH。这里不会自动发送消息。</p>
    </aside>
    <section class="viewport" aria-label="手机预览">
      <div class="phone" id="phone"><iframe id="dsh" title="DSH 手机界面" referrerpolicy="same-origin"></iframe></div>
    </section>
  </main>
  <script>
    const controls=document.querySelector('#controls');
    const frame=document.querySelector('#dsh');
    const phone=document.querySelector('#phone');
    const full=document.querySelector('#full');
    const replay=document.querySelector('#replay-startup');
    const replayStatus=document.querySelector('#replay-status');
    let replayId=0,replayTimeout=null;
    let authenticating=true;
    function previewUrl() {
      const data=new FormData(controls);
      const url=new URL('http://127.0.0.1:8787/');
      url.searchParams.set('dafeiyu-preview','mobile');
      url.searchParams.set('dafeiyu-theme',data.get('theme'));
      url.searchParams.set('dafeiyu-material',String(data.has('material')));
      url.searchParams.set('dafeiyu-motion',String(data.has('motion')));
      return url.href;
    }
    function update(reload=true) {
      const width=new FormData(controls).get('width');
      phone.style.setProperty('--preview-width',`${width}px`);
      frame.style.height=`${width==='320'?740:width==='430'?932:844}px`;
      full.href=previewUrl();
      if(reload&&!authenticating)frame.src=full.href;
    }
    controls.addEventListener('submit',event=>event.preventDefault());
    controls.addEventListener('change',event=>update(event.target.name!=='width'));
    document.querySelector('#reload').addEventListener('click',()=>update());
    replay.addEventListener('click',()=>{
      const requestId=++replayId;
      replay.disabled=true;
      replayStatus.textContent='正在准备动画…';
      frame.contentWindow.postMessage({type:'dafeiyu-startup-preview',version:1,action:'replay',requestId},'http://127.0.0.1:8787');
      clearTimeout(replayTimeout);
      replayTimeout=setTimeout(()=>{
        replay.disabled=false;
        replayStatus.textContent='页面尚未准备好，请刷新预览后再播放。';
      },6500);
    });
    window.addEventListener('message',event=>{
      if(event.origin!=='http://127.0.0.1:8787'||event.source!==frame.contentWindow)return;
      const data=event.data;
      if(!data||data.type!=='dafeiyu-startup-preview-state'||data.version!==1||data.requestId!==replayId)return;
      if(data.state==='playing')replayStatus.textContent='正在播放启动动画…';
      else if(['complete','cancelled','unavailable'].includes(data.state)){
        clearTimeout(replayTimeout);replayTimeout=null;replay.disabled=false;
        replayStatus.textContent=data.state==='complete'?'播放完成，可以再次预览。':data.state==='cancelled'?'预览已结束。':'DSH 页面尚未就绪，请稍后再试。';
      }
    });
    frame.addEventListener('load',()=>{
      clearTimeout(replayTimeout);replayTimeout=null;replay.disabled=false;
      if(!authenticating)return;
      authenticating=false;
      update();
    });
    update(false);
    frame.src='/session';
  </script>
</body>
</html>
